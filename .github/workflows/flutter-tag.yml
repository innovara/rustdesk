name: Flutter Tag Build

on:
  workflow_dispatch:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - '[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-[0-9]+'
      - '[0-9]+.[0-9]+.[0-9]+-[0-9]+'

jobs:
  run-flutter-tag-build:
    uses: ./.github/workflows/flutter-build.yml
    secrets: inherit
    with:
      upload-artifact: true
      upload-tag: ${{ github.ref_name }}
      publish-update-metadata: ${{ github.repository == 'rustdesk/rustdesk' }}

  publish-innovara-update-metadata:
    needs: run-flutter-tag-build
    # Run even if an unrelated platform failed; a missing installer fails the download below.
    if: ${{ !cancelled() && github.repository == 'innovara/rustdesk' && startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    env:
      TAG_NAME: ${{ github.ref_name }}
    steps:
      - name: Resolve version
        id: version
        shell: bash
        run: |
          # The client only offers updates for x.y.z / vx.y.z release ids.
          if [[ "$TAG_NAME" =~ ^v?([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            echo "version=${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Skipping signed update metadata for non-release tag $TAG_NAME"
          fi

      - name: Checkout source code
        if: steps.version.outputs.version != ''
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Install Python
        if: steps.version.outputs.version != ''
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        if: steps.version.outputs.version != ''
        run: 'python -m pip install --only-binary=:all: --require-hashes -r res/update/update_metadata_requirements.txt'

      - name: Validate update metadata keys
        if: steps.version.outputs.version != ''
        env:
          RUSTDESK_UPDATE_ED25519_SEED: ${{ secrets.RUSTDESK_UPDATE_ED25519_SEED }}
          RUSTDESK_UPDATE_ED25519_PUBLIC_KEY: ${{ vars.RUSTDESK_UPDATE_ED25519_PUBLIC_KEY }}
        run: python res/update/generate_update_metadata.py check-key

      - name: Download installers
        if: steps.version.outputs.version != ''
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release download "$TAG_NAME" -R "$GITHUB_REPOSITORY" -D ./artifacts \
            -p "rustdesk-${VERSION}-x86_64.exe" \
            -p "rustdesk-${VERSION}-x86_64.msi" \
            -p "rustdesk-${VERSION}-aarch64.exe" \
            -p "rustdesk-${VERSION}-aarch64.msi" \
            -p "rustdesk-${VERSION}-x86-sciter.exe" \
            -p "rustdesk-${VERSION}-aarch64.dmg" \
            -p "rustdesk-${VERSION}-x86_64.dmg"
          for f in x86_64.exe x86_64.msi aarch64.exe aarch64.msi x86-sciter.exe aarch64.dmg x86_64.dmg; do
            test -f "./artifacts/rustdesk-${VERSION}-${f}" || { echo "::error::Missing rustdesk-${VERSION}-${f} in release $TAG_NAME"; exit 1; }
          done

      - name: Sign update metadata
        if: steps.version.outputs.version != ''
        env:
          RUSTDESK_UPDATE_ED25519_SEED: ${{ secrets.RUSTDESK_UPDATE_ED25519_SEED }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          python res/update/generate_update_metadata.py sign \
            --artifact windows x86_64 exe "./artifacts/rustdesk-${VERSION}-x86_64.exe" \
            --artifact windows x86_64 msi "./artifacts/rustdesk-${VERSION}-x86_64.msi" \
            --artifact windows aarch64 exe "./artifacts/rustdesk-${VERSION}-aarch64.exe" \
            --artifact windows aarch64 msi "./artifacts/rustdesk-${VERSION}-aarch64.msi" \
            --artifact windows x86 exe "./artifacts/rustdesk-${VERSION}-x86-sciter.exe" \
            --artifact macos aarch64 dmg "./artifacts/rustdesk-${VERSION}-aarch64.dmg" \
            --artifact macos x86_64 dmg "./artifacts/rustdesk-${VERSION}-x86_64.dmg" \
            --version "$VERSION" --release-id "$TAG_NAME" \
            --package-id rustdesk \
            --release-base-url "https://github.com/${GITHUB_REPOSITORY}/releases/download" \
            --published-at "$(git log -1 --format=%cI)" \
            --metadata-out ./rustdesk-update.json \
            --signature-out ./rustdesk-update.json.sig

      - name: Verify update metadata
        if: steps.version.outputs.version != ''
        env:
          RUSTDESK_UPDATE_ED25519_PUBLIC_KEY: ${{ vars.RUSTDESK_UPDATE_ED25519_PUBLIC_KEY }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          python res/update/generate_update_metadata.py verify \
            --metadata ./rustdesk-update.json \
            --signature ./rustdesk-update.json.sig \
            --artifact "./artifacts/rustdesk-${VERSION}-x86_64.exe" \
            --artifact "./artifacts/rustdesk-${VERSION}-x86_64.msi" \
            --artifact "./artifacts/rustdesk-${VERSION}-aarch64.exe" \
            --artifact "./artifacts/rustdesk-${VERSION}-aarch64.msi" \
            --artifact "./artifacts/rustdesk-${VERSION}-x86-sciter.exe" \
            --artifact "./artifacts/rustdesk-${VERSION}-aarch64.dmg" \
            --artifact "./artifacts/rustdesk-${VERSION}-x86_64.dmg" \
            --version "$VERSION" --release-id "$TAG_NAME" \
            --package-id rustdesk \
            --release-base-url "https://github.com/${GITHUB_REPOSITORY}/releases/download"

      # Clients discover the release through the metadata, so upload it after its signature.
      - name: Publish signed update metadata
        if: steps.version.outputs.version != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$TAG_NAME" -R "$GITHUB_REPOSITORY" --clobber ./rustdesk-update.json.sig
          gh release upload "$TAG_NAME" -R "$GITHUB_REPOSITORY" --clobber ./rustdesk-update.json
